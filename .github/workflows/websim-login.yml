name: Websim device login

# Runs the Websim CLI device-login handshake from a runner (which has open egress)
# and seals the resulting auth token with the repo's RSA public key.
#
# The token is never written to the log in plaintext — only the sealed envelope
# is, and only the holder of the matching private key can open it.

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'How long to wait for browser confirmation'
        required: false
        default: '45'
  pull_request:
    paths:
      - '.github/workflows/websim-login.yml'
      - '.github/scripts/websim-login.mjs'

permissions:
  contents: read

jobs:
  login:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'arena/3a0c3639-3d-stuff'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Websim login handshake
        env:
          TIMEOUT_MINUTES: ${{ inputs.timeout_minutes || '45' }}
        run: |
          node .github/scripts/websim-login.mjs \
            --public-key .github/websim-login-pub.pem \
            --timeout-minutes "$TIMEOUT_MINUTES"
